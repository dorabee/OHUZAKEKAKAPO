<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cacapodance</title>
    <link rel="icon" type="image/png" href="../img/logo-img.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 画面全体の操作領域。JavaScriptがポインター操作を受け取ります。 -->
    <div class="main-content">
        <!-- JavaScriptが生成した紙吹雪を入れる表示専用レイヤーです。 -->
        <div id="party-confetti-layer" class="party-confetti-layer" aria-hidden="true"></div>
        <!-- 左右下端に固定するCSS製クラッカー。発射時だけ反動アニメーションを付けます。 -->
        <div class="party-cracker-layer" aria-hidden="true">
            <div class="party-cracker party-cracker-left">
                <span class="party-cracker-fuse"><i class="party-cracker-spark"></i></span>
                <span class="party-cracker-body"><i class="party-cracker-crease"></i></span>
            </div>
            <div class="party-cracker party-cracker-right">
                <span class="party-cracker-fuse"><i class="party-cracker-spark"></i></span>
                <span class="party-cracker-body"><i class="party-cracker-crease"></i></span>
            </div>
        </div>
        <div class="container-main">
            <!-- JavaScriptが1.png〜10.pngを切り替えるパーティーパロット本体です。 -->
            <img id="kakapo" class="party" src="../img/1.png" alt="回転するパーティーパロット" draggable="false">
        </div>
        <!-- ゲージ55%で表示するメッセージ領域。空の状態からJavaScriptが文面を設定します。 -->
        <div id="party-popup" class="party-popup" role="status" aria-live="polite" aria-atomic="true"></div>
        <!-- audio/default.mp3を既定曲にし、選択曲へ切り替えても同じ再生要素を使います。 -->
        <audio id="party-music" src="../audio/default.mp3" preload="none"></audio>
        <section class="party-music-panel" aria-label="音楽の操作">
            <div class="party-music-heading">
                <strong>PARTY MUSIC</strong>
                <output id="party-music-file-name">default.mp3</output>
            </div>
            <div class="party-music-actions">
                <label class="party-music-file-button" for="party-music-file">音楽ファイルを選択</label>
                <input id="party-music-file" class="party-music-file-input" type="file" accept="audio/*">
                <button id="party-music-play" class="party-music-play" type="button">再生を試す</button>
            </div>
            <label class="party-music-volume-control" for="party-music-volume">
                <span>最大音量</span>
                <input id="party-music-volume" type="range" min="0" max="100" value="90">
                <output id="party-music-volume-value">90%</output>
            </label>
            <output id="party-music-status" class="party-music-status" role="status" aria-live="polite">PARTYゲージ50%以上で再生し、ゲージに合わせて音量が上がります。</output>
        </section>
        <!-- 下のボタンはゲーム操作の確認・リセット用です。 -->
        <button id="reset-party-gauge" class="reset-party-gauge" type="button">RESET PARTY</button>
        <button id="debug-boost" class="debug-boost" type="button" aria-pressed="false">HOLD FOR 100%</button>
        <!-- 学習・調整用: ゲージ上昇率を倍にする操作と、指定値でゲージを固定する操作です。 -->
        <section class="party-debug-panel" aria-label="パーティーゲージのデバッグ操作">
            <button id="double-party-gauge" class="party-debug-button" type="button" aria-pressed="false">ゲージ上昇 ×2</button>
            <div class="party-gauge-lock-control">
                <label for="party-gauge-lock-value">固定値</label>
                <input id="party-gauge-lock-value" type="number" min="0" max="100" step="0.1" value="50" inputmode="decimal">
                <span>%</span>
                <button id="toggle-party-gauge-lock" class="party-debug-button" type="button" aria-pressed="false">固定</button>
            </div>
        </section>
        <!-- 速度の割合と、速度を維持した時間で増減するパーティーゲージです。 -->
        <div class="speed-meter" role="meter" aria-label="回転速度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="停止">
            <div class="speed-meter-heading">
                <span class="speed-meter-title">ROTATION SPEED</span>
                <output id="speed-value">0%</output>
            </div>
            <div class="speed-meter-track" aria-hidden="true">
                <div id="speed-fill" class="speed-meter-fill"></div>
            </div>
            <output id="spin-direction" class="spin-direction" aria-live="polite">停止</output>
            <div class="party-gauge" role="meter" aria-label="Party gauge" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%">
                <div class="party-gauge-heading">
                    <span class="party-gauge-title">PARTY</span>
                    <output id="party-gauge-value">0%</output>
                </div>
                <div class="party-gauge-track" aria-hidden="true">
                    <div id="party-gauge-fill" class="party-gauge-fill"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
